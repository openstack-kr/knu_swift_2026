apiVersion: 1

datasources:
  - name: Swift Quickwit Logs
    uid: swift_quickwit_logs
    type: quickwit-quickwit-datasource
    access: proxy
    url: http://quickwit:7280/api/v1
    isDefault: false
    jsonData:
      index: swift-proxy-logs
      logMessageField: message
      logLevelField: status_class
