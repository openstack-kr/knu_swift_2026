version: 0.8
index_id: swift-container-sync-events
doc_mapping:
  mode: dynamic
  timestamp_field: timestamp
  field_mappings:
  - name: timestamp
    type: datetime
    input_formats:
    - rfc3339
    output_format: rfc3339
    indexed: true
    fast: true
    stored: true
    fast_precision: seconds
  - name: event_type
    type: text
    tokenizer: raw
    record: basic
    fast:
      normalizer: raw
    fieldnorms: false
    stored: true
  - name: account
    type: text
    tokenizer: raw
    record: basic
    fast:
      normalizer: raw
    fieldnorms: false
    stored: true
  - name: container
    type: text
    tokenizer: raw
    record: basic
    fast:
      normalizer: raw
    fieldnorms: false
    stored: true
  - name: object
    type: text
    tokenizer: raw
    record: basic
    fast:
      normalizer: raw
    fieldnorms: false
    stored: true
  - name: method
    type: text
    tokenizer: raw
    record: basic
    fast:
      normalizer: raw
    fieldnorms: false
    stored: true
  - name: outcome
    type: text
    tokenizer: raw
    record: basic
    fast:
      normalizer: raw
    fieldnorms: false
    stored: true
  - name: reason
    type: text
    tokenizer: raw
    record: basic
    fast:
      normalizer: raw
    fieldnorms: false
    stored: true
  - name: state
    type: text
    tokenizer: raw
    record: basic
    fast:
      normalizer: raw
    fieldnorms: false
    stored: true
  - name: host
    type: text
    tokenizer: raw
    record: basic
    fast:
      normalizer: raw
    fieldnorms: false
    stored: true
  - name: source_path
    type: text
    tokenizer: raw
    record: basic
    fast:
      normalizer: raw
    fieldnorms: false
    stored: true
  - name: remote_container_path
    type: text
    tokenizer: raw
    record: basic
    fast:
      normalizer: raw
    fieldnorms: false
    stored: true
  - name: status_class
    type: text
    tokenizer: raw
    record: basic
    fast:
      normalizer: raw
    fieldnorms: false
    stored: true
  - name: status_code
    type: u64
    indexed: true
    fast: true
    stored: true
  - name: duration_ms
    type: f64
    indexed: true
    fast: true
    stored: true
  - name: row_id
    type: u64
    indexed: true
    fast: true
    stored: true
  - name: deleted
    type: bool
    indexed: true
    fast: true
    stored: true
  - name: bytes
    type: u64
    indexed: true
    fast: true
    stored: true
  - name: sync_point1
    type: u64
    indexed: true
    fast: true
    stored: true
  - name: sync_point2
    type: u64
    indexed: true
    fast: true
    stored: true
  - name: total_rows
    type: u64
    indexed: true
    fast: true
    stored: true
  - name: progress_percent
    type: f64
    indexed: true
    fast: true
    stored: true
  - name: event_timestamp
    type: f64
    indexed: true
    fast: true
    stored: true
search_settings:
  default_search_fields:
  - account
  - container
  - object
  - event_type
  - method
  - outcome
  - reason
  - state
  - host
  - source_path
  - remote_container_path
  - status_class
retention:
  period: 30 days
  schedule: daily
