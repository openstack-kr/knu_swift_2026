<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1260" viewBox="0 0 1680 1260">
  <defs>
    <style>
      .bg { fill: #f7f3ea; }
      .panel { fill: #fffdfa; stroke: #243447; stroke-width: 2; rx: 24; ry: 24; }
      .panel-left { fill: #fffaf6; stroke: #9a3412; stroke-width: 2; rx: 24; ry: 24; }
      .panel-right { fill: #f8fffb; stroke: #166534; stroke-width: 2; rx: 24; ry: 24; }
      .title { font: 700 36px sans-serif; fill: #111827; }
      .subtitle { font: 500 18px sans-serif; fill: #475569; }
      .section { font: 700 24px sans-serif; fill: #111827; }
      .panel-title { font: 700 26px sans-serif; fill: #111827; }
      .label { font: 700 19px sans-serif; fill: #111827; }
      .small { font: 500 15px sans-serif; fill: #334155; }
      .small-strong { font: 700 15px sans-serif; fill: #1f2937; }
      .emph { font: 700 15px sans-serif; fill: #065f46; }
      .step-common { fill: #ffffff; stroke: #64748b; stroke-width: 2; rx: 18; ry: 18; }
      .step-old { fill: #fff1e6; stroke: #c2410c; stroke-width: 2; rx: 18; ry: 18; }
      .step-new { fill: #dcfce7; stroke: #15803d; stroke-width: 2; rx: 18; ry: 18; }
      .step-blue { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; rx: 18; ry: 18; }
      .step-yellow { fill: #fef3c7; stroke: #b45309; stroke-width: 2; rx: 18; ry: 18; }
      .compare { fill: #f8fafc; stroke: #475569; stroke-width: 2; rx: 18; ry: 18; }
      .example { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; rx: 18; ry: 18; }
      .num-old { fill: #c2410c; }
      .num-new { fill: #15803d; }
      .num-text { font: 700 16px sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .arrow-old { stroke: #c2410c; stroke-width: 3; fill: none; marker-end: url(#arrowOld); }
      .arrow-new { stroke: #15803d; stroke-width: 3; fill: none; marker-end: url(#arrowNew); }
      .arrow-mid { stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 10 8; fill: none; marker-end: url(#arrowMid); }
    </style>
    <marker id="arrowOld" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#c2410c"/>
    </marker>
    <marker id="arrowNew" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#15803d"/>
    </marker>
    <marker id="arrowMid" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1680" height="1260"/>

  <text class="title" x="60" y="64">Container Sync: 기존 sync.py vs sync_parallel_v4.py</text>
  <text class="subtitle" x="60" y="98">위에서 아래로 읽으면 실행 순서가 보이고, 좌우를 보면 기존과 v4의 차이를 바로 비교할 수 있도록 다시 정리한 그림이다.</text>

  <rect class="panel-left" x="48" y="140" width="748" height="770"/>
  <rect class="panel-right" x="884" y="140" width="748" height="770"/>

  <text class="panel-title" x="78" y="184">기존: sync.py</text>
  <text class="small" x="78" y="212">핵심 특징: retry 구간은 사실상 모든 노드가 다시 훑는다.</text>

  <text class="panel-title" x="914" y="184">현재: sync_parallel_v4.py</text>
  <text class="small" x="914" y="212">핵심 특징: retry checker 분리 + takeover + batch 병렬 실행</text>

  <rect class="step-common" x="84" y="244" width="676" height="94"/>
  <circle class="num-old" cx="124" cy="291" r="18"/>
  <text class="num-text" x="124" y="292">1</text>
  <text class="label" x="156" y="280">기본 준비</text>
  <text class="small" x="156" y="304">Broker 열기, sync metadata 확인, local ordinal 계산</text>

  <rect class="step-common" x="920" y="244" width="676" height="94"/>
  <circle class="num-new" cx="960" cy="291" r="18"/>
  <text class="num-text" x="960" y="292">1</text>
  <text class="label" x="992" y="280">기본 준비</text>
  <text class="small" x="992" y="304">Broker 열기, sync metadata 확인, local ordinal 계산</text>

  <path class="arrow-old" d="M422 338 L422 372"/>
  <path class="arrow-new" d="M1258 338 L1258 372"/>

  <rect class="step-old" x="84" y="372" width="676" height="160"/>
  <circle class="num-old" cx="124" cy="420" r="18"/>
  <text class="num-text" x="124" y="421">2</text>
  <text class="label" x="156" y="408">retry 구간 처리</text>
  <text class="small" x="156" y="434">조건: sync_point2 &lt; sync_point1</text>
  <text class="small" x="156" y="458">각 노드가 retry row 전체를 다시 따라가며 container_sync_row() 호출</text>
  <text class="small" x="156" y="482">이미 처리된 row도 다시 remote HEAD 를 수행할 수 있음</text>
  <text class="small" x="156" y="506">즉 retry 구간의 중복 work 가 큼</text>

  <rect class="step-new" x="920" y="372" width="676" height="190"/>
  <circle class="num-new" cx="960" cy="420" r="18"/>
  <text class="num-text" x="960" y="421">2</text>
  <text class="label" x="992" y="408">retry 구간 처리</text>
  <text class="small" x="992" y="434">checker별 <tspan class="emph">retry_state {point, updated_at}</tspan> 로드</text>
  <text class="small" x="992" y="458">row owner 계산 후 <tspan class="emph">retry checker</tspan> = <tspan class="emph">(owner + shift) % replica_count</tspan></text>
  <text class="small" x="992" y="482">현재 노드는 <tspan class="emph">자기 checker row만 실행</tspan></text>
  <text class="small" x="992" y="506">checker가 stale 하면 <tspan class="emph">다른 노드가 takeover</tspan></text>
  <text class="small" x="992" y="530">retry state 는 <tspan class="emph">memcache 우선</tspan>, 종료 시 <tspan class="emph">metadata flush</tspan></text>

  <path class="arrow-old" d="M422 532 L422 566"/>
  <path class="arrow-new" d="M1258 562 L1258 596"/>

  <rect class="step-yellow" x="84" y="566" width="676" height="118"/>
  <circle class="num-old" cx="124" cy="625" r="18"/>
  <text class="num-text" x="124" y="626">3</text>
  <text class="label" x="156" y="612">sync_point2 갱신</text>
  <text class="small" x="156" y="638">단일 progress 로 retry 완료 지점을 관리</text>
  <text class="small" x="156" y="662">표현은 단순하지만, retry work 분담은 없음</text>

  <rect class="step-blue" x="920" y="596" width="676" height="130"/>
  <circle class="num-new" cx="960" cy="660" r="18"/>
  <text class="num-text" x="960" y="661">3</text>
  <text class="label" x="992" y="646">sync_point2 갱신</text>
  <text class="small" x="992" y="672">checker별 point 중 <tspan class="emph">최소값</tspan>을 sync_point2 로 사용</text>
  <text class="small" x="992" y="696"><tspan class="emph">가장 느린 checker 기준</tspan>으로만 retry 완료를 인정</text>

  <path class="arrow-old" d="M422 684 L422 718"/>
  <path class="arrow-new" d="M1258 726 L1258 760"/>

  <rect class="step-old" x="84" y="718" width="676" height="150"/>
  <circle class="num-old" cx="124" cy="766" r="18"/>
  <text class="num-text" x="124" y="767">4</text>
  <text class="label" x="156" y="754">신규 row 구간</text>
  <text class="small" x="156" y="780">sync_point1 이후 row 는 owner 가 처리</text>
  <text class="small" x="156" y="804">하지만 retry 구간 이득이 적어 전체 비용이 큼</text>
  <text class="small" x="156" y="828">row 처리 자체는 배치/병렬 최적화가 없음</text>

  <rect class="step-new" x="920" y="760" width="676" height="150"/>
  <circle class="num-new" cx="960" cy="808" r="18"/>
  <text class="num-text" x="960" y="809">4</text>
  <text class="label" x="992" y="796">신규 row 구간</text>
  <text class="small" x="992" y="822">sync_point1 이후 row 는 기존처럼 <tspan class="emph">owner 만 처리</tspan></text>
  <text class="small" x="992" y="846">rows 를 <tspan class="emph">batch</tspan> 로 읽고 <tspan class="emph">ContextPool</tspan> 로 병렬 실행</text>
  <text class="small" x="992" y="870"><tspan class="emph">batch</tspan> 를 훑을 때마다 sync_point1 갱신</text>

  <path class="arrow-mid" d="M760 452 L920 452"/>
  <path class="arrow-mid" d="M760 640 L920 660"/>
  <path class="arrow-mid" d="M760 792 L920 808"/>

  <rect class="compare" x="48" y="950" width="1584" height="170"/>
  <text class="section" x="78" y="994">무엇이 바뀌었나</text>
  <text class="small-strong" x="78" y="1028">1. 기존은 retry 구간을 모든 노드가 다시 검사했지만, v4 는 <tspan class="emph">retry row 를 checker별로 분담</tspan>한다.</text>
  <text class="small-strong" x="78" y="1058">2. v4 는 <tspan class="emph">stale checker takeover</tspan> 와 <tspan class="emph">retry_state 관리</tspan>를 추가했다.</text>
  <text class="small-strong" x="78" y="1088">3. v4 는 retry/new row 모두 <tspan class="emph">batch + ContextPool 병렬 실행</tspan>을 사용한다.</text>

  <rect class="example" x="48" y="1142" width="1584" height="82"/>
  <text class="section" x="78" y="1182">간단한 예시</text>
  <text class="small" x="254" y="1182">replica = 3 일 때 node 1 이 sp1 에서 1,3 을 처리했다면, sp2 에서는 <tspan class="emph">2,4 같은 다른 row 를 checker 역할로 처리</tspan>한다. 즉 retry 구간도 <tspan class="emph">대략 1/3 씩 분담</tspan>된다.</text>
</svg>
